name: CI

# A branch with an open PR would otherwise be built twice: once for the push
# and again for the pull_request. Pushes are therefore limited to the trunk,
# and everything else is covered by its PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '2.x']
  # So long-lived branches without an open PR can still be checked on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # corepack fetches the pinned pnpm on first use; without this it can stop to
  # ask for confirmation.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Check the built manifest is valid MV3
        run: pnpm check:manifest

      # The build succeeds even when dev/ is imported from src/, so this is the
      # only thing standing between a stray import and shipping the harness's
      # fake chrome API to users.
      - name: Check no dev-harness code leaked into the build
        run: pnpm check:bundle

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: extension-unpacked
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # E2E drives a real Chromium, so only run it once the cheap checks are green.
    needs: [verify, build]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build extension
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
